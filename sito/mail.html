<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa Odello · Bed &amp; Breakfast</title>
  <meta name="description" content="Bed &amp; Breakfast con suite luminose, colazione fatta in casa e accoglienza familiare.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="CSS/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
<main>
  <div class="wrap grid">
    <div class="intro">
      <h1>Scrivici</h1>
      <p>Hai domande sulla camera o vuoi sapere se le tue date sono libere? Compila il modulo: ti rispondiamo via email, di solito entro un giorno.</p>
      <p>Non serve registrarsi.</p>
      <dl>
        <dt>Telefono</dt><dd><a href="tel:+390000000000">+39 000 000 0000</a></dd>
        <dt>Check-in</dt><dd>15:00 – 21:00</dd>
        <dt>Check-out</dt><dd>entro le 11:00</dd>
      </dl>
    </div>
 
    <form id="contact-form" novalidate>
      <div class="full">
        <label for="tipo">Cosa vuoi fare?</label>
        <select id="tipo" name="tipo">
          <option>Chiedere informazioni</option>
          <option>Richiedere una prenotazione</option>
        </select>
      </div>
 
      <div>
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" autocomplete="name" required>
        <p class="err" data-for="nome"></p>
      </div>
      <div>
        <label for="email">La tua email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p class="err" data-for="email"></p>
      </div>
 
      <div>
        <label for="arrivo">Arrivo <small>(facoltativo)</small></label>
        <input id="arrivo" name="arrivo" type="date">
      </div>
      <div>
        <label for="partenza">Partenza <small>(facoltativo)</small></label>
        <input id="partenza" name="partenza" type="date">
        <p class="err" data-for="partenza"></p>
      </div>
 
      <div class="full">
        <label for="ospiti">Ospiti</label>
        <select id="ospiti" name="ospiti"><option>1</option><option selected>2</option></select>
      </div>
 
      <div class="full">
        <label for="messaggio">Messaggio</label>
        <textarea id="messaggio" name="messaggio" required></textarea>
        <p class="err" data-for="messaggio"></p>
      </div>
 
      <!-- campo trappola per i bot: gli utenti non lo vedono -->
      <div class="hp" aria-hidden="true">
        <label for="sito">Non compilare</label>
        <input id="sito" name="sito" type="text" tabindex="-1" autocomplete="off">
      </div>
 
      <div class="full check">
        <input id="privacy" type="checkbox" required>
        <label for="privacy" style="font-weight:400;margin:0">Acconsento al trattamento dei miei dati per ricevere una risposta. <a href="">Informativa privacy</a></label>
      </div>
      <p class="err full" data-for="privacy" style="margin-top:-.8rem"></p>
 
      <div class="full"><button class="btn" type="submit">Invia messaggio</button></div>
      <div class="full status" id="status" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>
 
<script src="JS/mail.js"></script>
</body>
