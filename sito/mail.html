<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrivici · Casa Odello</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="CSS/style2.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="dark">
  <div class="wrap nav">
  <a href="index.html" class="title">Casa Odello</a>
  <nav aria-label="Principale">
    <a href="index.html">Torna al sito</a>
  </nav>
</div>
</header>

<main class="mail-page">
  <div class="wrap mail-grid">
    <div class="mail-intro">
      <h1>Scrivici</h1>
      <p>Hai domande sulla camera, desideri chiedere informazioni o vuoi sapere se le tue date sono libere? Compila il modulo: ti rispondiamo via email, di solito entro un giorno.</p>
      <p>Non serve registrarsi.</p>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>

    <form id="contact-form" class="mail-form" novalidate>
      <div class="full">
        <label for="tipo">Cosa vuoi fare?</label>
        <select id="tipo" name="tipo">
          <option>Chiedere informazioni</option>
          <option>Richiedere una prenotazione</option>
        </select>
      </div>
      <div>
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" autocomplete="name" required>
        <p class="err" data-for="nome"></p>
      </div>
      <div>
        <label for="email">La tua email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p class="err" data-for="email"></p>
      </div>
      <div>
        <label for="arrivo">Arrivo <small>(facoltativo)</small></label>
        <input id="arrivo" name="arrivo" type="date">
      </div>
      <div>
        <label for="partenza">Partenza <small>(facoltativo)</small></label>
        <input id="partenza" name="partenza" type="date">
        <p class="err" data-for="partenza"></p>
      </div>
      <div class="full">
        <label for="ospiti">Ospiti</label>
        <select id="ospiti" name="ospiti"><option>1</option><option selected>2</option></select>
      </div>
      <div class="full">
        <label for="messaggio">Messaggio</label>
        <textarea id="messaggio" name="messaggio" required></textarea>
        <p class="err" data-for="messaggio"></p>
      </div>

      <div class="hp" aria-hidden="true">
        <label for="sito">Non compilare</label>
        <input id="sito" name="sito" type="text" tabindex="-1" autocomplete="off">
      </div>

      <div class="full check">
        <input id="privacy" type="checkbox" required>
        <label for="privacy">Acconsento al trattamento dei miei dati per ricevere una risposta. <a href="">Informativa privacy</a></label>
      </div>
      <p class="err full" data-for="privacy" style="margin-top:-.8rem"></p>

      <div class="full"><button class="btn" type="submit">Invia messaggio</button></div>
      <div class="full mail-choices" id="mail-choices" hidden></div>
    </form>
  </div>
</main>

<footer><div class="wrap">© <span id="year"></span> Casa Odello</div></footer>

<script src="JS/mail.js"></script>
</body>
</html>
